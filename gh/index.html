<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tggamesyt → GitHub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      font-family: ui-monospace, "Cascadia Code", "Fira Code", "Consolas", monospace;
      color: #e6edf3;
    }

    .card {
      text-align: center;
      padding: 2.5rem 3rem;
      border: 1px solid #30363d;
      border-radius: 10px;
      background: #161b22;
      max-width: 420px;
      width: 90%;
    }

    .icon {
      font-size: 2.5rem;
      line-height: 1;
      margin-bottom: 1.25rem;
    }

    .status {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8b949e;
      margin-bottom: 0.5rem;
    }

    .repo {
      font-size: 1.1rem;
      color: #58a6ff;
      margin-bottom: 1.5rem;
      word-break: break-all;
    }

    .bar-wrap {
      height: 3px;
      background: #21262d;
      border-radius: 99px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #238636, #2ea043);
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    .bar.error { background: linear-gradient(90deg, #b91c1c, #dc2626); }

    .msg {
      margin-top: 1rem;
      font-size: 0.78rem;
      color: #8b949e;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">🔍</div>
    <div class="status" id="status">Checking…</div>
    <div class="repo" id="repo"></div>
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    const BASE    = "tggamesyt";
    const PROFILE = `https://github.com/${BASE}`;

    const icon   = document.getElementById("icon");
    const status = document.getElementById("status");
    const repoEl = document.getElementById("repo");
    const bar    = document.getElementById("bar");
    const msg    = document.getElementById("msg");

    const raw = location.search.slice(1).split("&")[0].split("=")[0].trim();

    function redirect(url) {
      msg.textContent = url;
      bar.style.width = "100%";
      location.replace(url);
    }

    if (raw === "site") {
      const siteUrl = `https://github.com/${BASE}/${BASE}.github.io`;
      repoEl.textContent = `${BASE}/${BASE}.github.io`;
      status.textContent = "Redirecting…";
      icon.textContent   = "🌐";
      redirect(siteUrl);
    } else if (!raw) {
      repoEl.textContent = BASE;
      status.textContent = "No repo specified";
      icon.textContent   = "👤";
      redirect(PROFILE);
    } else {
      const repoUrl = `https://github.com/${BASE}/${raw}`;
      const apiUrl  = `https://api.github.com/repos/${BASE}/${raw}`;

      repoEl.textContent = `${BASE}/${raw}`;
      status.textContent = "Checking repository…";
      msg.textContent    = "Calling GitHub API…";
      bar.style.width    = "30%";

      fetch(apiUrl, { headers: { "Accept": "application/vnd.github+json" } })
        .then(res => {
          if (res.status === 200) {
            status.textContent = "Repository found ✓";
            icon.textContent   = "✅";
          } else {
            status.textContent = "Redirecting…";
            icon.textContent   = "🔒";
          }
          redirect(repoUrl);
        })
        .catch(() => {
          status.textContent = "Check failed";
          icon.textContent   = "⚠️";
          bar.classList.add("error");
          redirect(PROFILE);
        });
    }
  </script>
</body>
</html>
