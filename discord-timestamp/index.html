<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Discord Timestamp Generator</title>
  <style>
    :root {
      --bg-color: #2c2f33;
      --text-color: #ffffff;
      --input-bg: #23272a;
      --border-color: #7289da;
      --secondary-color: #99aab5;
    }

    body.light {
      --bg-color: #f5f5f5;
      --text-color: #222;
      --input-bg: #ffffff;
      --border-color: #4a90e2;
      --secondary-color: #555;
    }

    body {
      font-family: sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 600px;
      margin: 2rem auto;
      padding: 2rem;
      transition: all 0.3s ease;
    }

    h1 {
      text-align: center;
    }

    label, select, input {
      display: block;
      width: 100%;
      margin-top: 1rem;
    }

    input, select {
      padding: 0.5rem;
      background: var(--input-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 5px;
    }

    #output, #rendered {
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--input-bg);
      border: 1px solid var(--secondary-color);
      border-radius: 5px;
      font-family: monospace;
      word-break: break-word;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    button {
      flex: 1;
      padding: 0.6rem;
      background-color: var(--border-color);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background-color: #5b6eae;
    }

    @media (max-width: 480px) {
      button {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <h1>Discord Timestamp Generator</h1>

  <label for="datetime">Select Date & Time:</label>
  <input type="datetime-local" id="datetime" />

  <label for="format">Select Format:</label>
  <select id="format">
    <option value="t">Short Time (e.g. 9:41 PM)</option>
    <option value="T">Long Time (e.g. 9:41:30 PM)</option>
    <option value="d">Short Date (e.g. 30/06/2025)</option>
    <option value="D">Long Date (e.g. 30 June 2025)</option>
    <option value="f">Short Date/Time (e.g. 30 June 2025 9:41 PM)</option>
    <option value="F" selected>Long Date/Time (e.g. Monday, 30 June 2025 9:41 PM)</option>
    <option value="R">Relative Time (e.g. in 2 months)</option>
  </select>

  <div id="output">&lt;t:TIMESTAMP:FORMAT&gt;</div>
  <div id="rendered">*(preview will appear here)*</div>

  <div class="controls">
    <button onclick="copyToClipboard()">Copy to Clipboard</button>
    <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
  </div>

  <hr style="margin-top: 2rem; border-color: var(--secondary-color);" />

  <label for="editInput">Or paste a Discord timestamp to edit it:</label>
  <input type="text" id="editInput" placeholder="<t:1751313660:F> or just 1751313660" />
  <div class="controls">
    <button onclick="parseTimestamp()">Load Timestamp</button>
  </div>
  <div id="parseError" style="color: #f04747; margin-top: 0.5rem; font-size: 0.9rem;"></div>

  <script>
    const datetimeInput = document.getElementById('datetime');
    const formatSelect = document.getElementById('format');
    const output = document.getElementById('output');
    const rendered = document.getElementById('rendered');
    const editInput = document.getElementById('editInput');
    const parseError = document.getElementById('parseError');

    const MAX_TIMESTAMP = 8640000000000;
    const MIN_TIMESTAMP = -8640000000000;

    const FORMAT_MAP = {
      t: { timeStyle: 'short' },
      T: { timeStyle: 'medium' },
      d: { dateStyle: 'short' },
      D: { dateStyle: 'long' },
      f: { dateStyle: 'long', timeStyle: 'short' },
      F: { dateStyle: 'full', timeStyle: 'short' },
      R: 'relative'
    };

    function updateOutput() {
      const date = new Date(datetimeInput.value);
      if (isNaN(date.getTime())) {
        output.textContent = "Please enter a valid date/time.";
        rendered.textContent = "*(invalid date)*";
        return;
      }

      const timestamp = Math.floor(date.getTime() / 1000);

      if (timestamp < MIN_TIMESTAMP || timestamp > MAX_TIMESTAMP) {
        output.textContent = `<t:${timestamp}:?> (outside supported range)`;
        rendered.textContent = "*(too old or too far in future)*";
        return;
      }

      const format = formatSelect.value;
      const tag = `<t:${timestamp}:${format}>`;
      output.textContent = tag;

      if (format === 'R') {
        const diff = timestamp - Math.floor(Date.now() / 1000);
        rendered.textContent = formatRelativeTime(diff);
      } else {
        rendered.textContent = new Intl.DateTimeFormat(undefined, FORMAT_MAP[format]).format(date);
      }
    }

    // Discord's relative timestamps are powered by moment.js under the hood,
    // which uses these thresholds (rather than plain calendar year/month/day math).
    function formatRelativeTime(seconds) {
      const future = seconds > 0;
      const abs = Math.abs(seconds);

      let phrase;
      if (abs < 45) {
        phrase = "a few seconds";
      } else if (abs < 90) {
        phrase = "a minute";
      } else if (abs < 45 * 60) {
        phrase = Math.round(abs / 60) + " minutes";
      } else if (abs < 90 * 60) {
        phrase = "an hour";
      } else if (abs < 22 * 3600) {
        phrase = Math.round(abs / 3600) + " hours";
      } else if (abs < 36 * 3600) {
        phrase = "a day";
      } else if (abs < 25 * 86400) {
        phrase = Math.round(abs / 86400) + " days";
      } else if (abs < 45 * 86400) {
        phrase = "a month";
      } else if (abs < 320 * 86400) {
        phrase = Math.round(abs / (30.44 * 86400)) + " months";
      } else if (abs < 548 * 86400) {
        phrase = "a year";
      } else {
        phrase = Math.round(abs / (365.25 * 86400)) + " years";
      }

      return future ? `in ${phrase}` : `${phrase} ago`;
    }

    // Converts a Date into the "YYYY-MM-DDTHH:mm" format datetime-local inputs expect,
    // using local time (not UTC, which is what toISOString() would give us).
    function toLocalDatetimeValue(date) {
      const pad = n => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function parseTimestamp() {
      parseError.textContent = '';
      const raw = editInput.value.trim();
      if (!raw) {
        parseError.textContent = 'Please paste a timestamp first.';
        return;
      }

      // Matches either a full Discord tag like <t:1751313660:F> or just a bare number.
      const match = raw.match(/^<t:(-?\d+)(?::([tTdDfFR]))?>$/) || raw.match(/^(-?\d+)$/);

      if (!match) {
        parseError.textContent = 'Could not parse that. Use a format like <t:1751313660:F> or just 1751313660.';
        return;
      }

      const timestamp = parseInt(match[1], 10);
      const format = match[2];

      if (timestamp < MIN_TIMESTAMP || timestamp > MAX_TIMESTAMP) {
        parseError.textContent = 'That timestamp is outside the supported date range.';
        return;
      }

      const date = new Date(timestamp * 1000);
      datetimeInput.value = toLocalDatetimeValue(date);

      if (format) {
        formatSelect.value = format;
      }

      updateOutput();
    }

    function copyToClipboard() {
      const text = output.textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert('Copied to clipboard!');
      }).catch(err => {
        alert('Failed to copy: ' + err);
      });
    }

    function toggleDarkMode() {
      document.body.classList.toggle('light');
    }

    datetimeInput.addEventListener('input', updateOutput);
    formatSelect.addEventListener('change', updateOutput);
    editInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        parseTimestamp();
      }
    });
  </script>
</body>
</html>
