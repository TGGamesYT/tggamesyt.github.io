// ═══════════════════════════════════════════════════════════════════
// .PAINT FILE FORMAT — HEIF/ISOBMFF with UNCI layers + IOVL composite
//
// Structure of a .paint file:
//   ftyp  — brand 'mif1', compat ['mif1','gcmi','isoa','miaf']
//   meta  — HEIF metadata (FullBox)
//     hdlr  — handler type 'pict'
//     pitm  — primary item ID = iovl item (the composite)
//     iinf  — item info: N×'unci' (layers) + 1×'iovl' + 1×'Exif'
//     iloc  — item locations (v1, offset_sz=4, len_sz=4)
//     iprp  — item properties
//       ipco — property container
//         cmpC  — compression codec = 'defl' (raw deflate)
//         ispe  — image spatial extents (width × height)
//         colr  — nclx colour info (BT.709/sRGB, full range)
//         cmpd  — component definition: R(4),G(5),B(6),A(7)
//         uncC  — uncompressed config: profile='gene', BGRA order
//         pixi  — 4 channels × 8 bits
//       ipma — property associations per item
//     iref  — iovl 'dimg' → [layer items]; Exif 'cdsc' → iovl
//     idat  — iovl item data (overlay descriptor, 30 bytes)
//   free  — optional padding
//   mdat  — pixel data: each layer = raw-deflate compressed BGRA,
//            followed by Exif block
//
// Pixel data per layer (uncompressed):
//   width × height pixels, row-major
//   Each pixel: B(1) G(1) R(1) A(1)  ← BGRA, 8-bit channels
// ═══════════════════════════════════════════════════════════════════

// ── Low-level byte-builder helpers ─────────────────────────────────
function u32be(n) {
  const b = new Uint8Array(4);
  new DataView(b.buffer).setUint32(0, n, false);
  return b;
}
function u16be(n) {
  const b = new Uint8Array(2);
  new DataView(b.buffer).setUint16(0, n, false);
  return b;
}
function i16be(n) {
  const b = new Uint8Array(2);
  new DataView(b.buffer).setInt16(0, n, false);
  return b;
}
function str4(s) { return new TextEncoder().encode(s.slice(0, 4).padEnd(4, '\0')); }
function concat(...arrays) {
  const total = arrays.reduce((s, a) => s + a.length, 0);
  const out = new Uint8Array(total);
  let off = 0;
  for (const a of arrays) { out.set(a, off); off += a.length; }
  return out;
}
function makeBox(type, payload) {
  return concat(u32be(8 + payload.length), str4(type), payload);
}
function makeFullBox(type, version, flags, payload) {
  const vf = new Uint8Array(4);
  vf[0] = version;
  vf[1] = (flags >> 16) & 0xFF;
  vf[2] = (flags >>  8) & 0xFF;
  vf[3] =  flags        & 0xFF;
  return makeBox(type, concat(vf, payload));
}

// ── HEIF box parser ─────────────────────────────────────────────────
function parseHeifBoxes(buf, start, end) {
  const dv = new DataView(buf);
  const boxes = [];
  let off = start;
  while (off < end - 8) {
    const size = dv.getUint32(off, false);
    const type = String.fromCharCode(
      dv.getUint8(off+4), dv.getUint8(off+5),
      dv.getUint8(off+6), dv.getUint8(off+7));
    if (size < 8 || off + size > end) break;
    boxes.push({ type, offset: off, size, dataStart: off + 8, dataEnd: off + size });
    off += size;
  }
  return boxes;
}

// ── .PAINT IMPORT ───────────────────────────────────────────────────
async function importPaintFile(file) {
  if (!file) return;
  const name = (file.name || '').toLowerCase();
  if (!name.endsWith('.paint') && file.type !== 'image/heic' && file.type !== 'image/heif') {
    showToast('Not a .paint file'); return;
  }
  showToast('Reading .paint…');

  try {
    const buf = await file.arrayBuffer();
    const dv  = new DataView(buf);

    // 1. Find top-level boxes
    const topBoxes = parseHeifBoxes(buf, 0, buf.byteLength);
    const metaBox  = topBoxes.find(b => b.type === 'meta');
    const idatBox  = topBoxes.find(b => b.type === 'idat');
    if (!metaBox) throw new Error('No meta box — not a valid .paint file');

    // 2. Parse meta children (meta is a FullBox: skip 4-byte version/flags)
    const metaChildren = parseHeifBoxes(buf, metaBox.dataStart + 4, metaBox.dataEnd);
    const iinfBox  = metaChildren.find(b => b.type === 'iinf');
    const ilocBox  = metaChildren.find(b => b.type === 'iloc');
    const idatInMeta = metaChildren.find(b => b.type === 'idat'); // idat may be inside meta
    const effectiveIdat = idatBox || idatInMeta;

    if (!iinfBox || !ilocBox) throw new Error('Malformed .paint: missing iinf or iloc');

    // 3. Parse iinf — collect unci (layer) item IDs in order
    const iinfVer = dv.getUint8(iinfBox.dataStart);
    const itemCount = dv.getUint16(iinfBox.dataStart + 4 + (iinfVer === 0 ? 0 : 2), false);
    // Actually item_count is at offset 4 (after version/flags) for v0, offset 4 for v0 still
    // iinf FullBox: 4 bytes vf, then 2-byte item_count, then infe boxes
    const iinfItemCount = dv.getUint16(iinfBox.dataStart + 4, false);
    const infeBoxes = parseHeifBoxes(buf, iinfBox.dataStart + 6, iinfBox.dataEnd);

    const layerItemIds = [];  // unci items in file order
    let iovlItemId = null;
    for (const infe of infeBoxes) {
      const ver = dv.getUint8(infe.dataStart);
      let itemId, itemTypeOff;
      if (ver === 2) { itemId = dv.getUint16(infe.dataStart + 4, false); itemTypeOff = infe.dataStart + 8; }
      else if (ver === 3) { itemId = dv.getUint32(infe.dataStart + 4, false); itemTypeOff = infe.dataStart + 10; }
      else continue;
      const itemType = String.fromCharCode(
        dv.getUint8(itemTypeOff), dv.getUint8(itemTypeOff+1),
        dv.getUint8(itemTypeOff+2), dv.getUint8(itemTypeOff+3));
      if (itemType === 'unci') layerItemIds.push(itemId);
      if (itemType === 'iovl') iovlItemId = itemId;
    }

    if (layerItemIds.length === 0) throw new Error('No layer items (unci) found in .paint');

    // 4. Parse iloc — build map: itemId → [{offset, length}]
    const ilocVer = dv.getUint8(ilocBox.dataStart);
    const offsetSize     = (dv.getUint8(ilocBox.dataStart + 4) >> 4) & 0xF;
    const lengthSize     =  dv.getUint8(ilocBox.dataStart + 4) & 0xF;
    const baseOffSize    = (dv.getUint8(ilocBox.dataStart + 5) >> 4) & 0xF;
    const indexSize      =  dv.getUint8(ilocBox.dataStart + 5) & 0xF;
    const ilocItemCount  =  dv.getUint16(ilocBox.dataStart + 6, false);

    function readN(byteOff, n) {
      let val = 0;
      for (let i = 0; i < n; i++) val = (val * 256) + dv.getUint8(byteOff + i);
      return val;
    }

    const ilocMap = {};
    let ip = ilocBox.dataStart + 8;
    for (let i = 0; i < ilocItemCount; i++) {
      const iid = dv.getUint16(ip, false); ip += 2;
      let cm = 0;
      if (ilocVer >= 1) { cm = dv.getUint16(ip, false) & 0xF; ip += 2; }
      ip += 2; // data_ref_index
      if (baseOffSize) ip += baseOffSize;
      const extentCount = dv.getUint16(ip, false); ip += 2;
      const extents = [];
      for (let j = 0; j < extentCount; j++) {
        if (indexSize) ip += indexSize;
        const off = offsetSize ? readN(ip, offsetSize) : 0; ip += offsetSize;
        const len = lengthSize ? readN(ip, lengthSize) : 0; ip += lengthSize;
        extents.push({ off, len, cm });
      }
      ilocMap[iid] = { cm: ilocVer >= 1 ? cm : 0, extents };
    }

    // 5. Get canvas size from iovl idat (if present) or ispe property
    let canvasW = 0, canvasH = 0;
    if (effectiveIdat && iovlItemId !== null) {
      const iovlLoc = ilocMap[iovlItemId];
      if (iovlLoc && iovlLoc.cm === 1 && iovlLoc.extents.length > 0) {
        // iovl data is at offset within idat box data
        const iovlOff  = effectiveIdat.dataStart + iovlLoc.extents[0].off;
        // iovl payload: 2 reserved + 4×uint16 RGBA fill + uint16 width + uint16 height + offsets
        canvasW = dv.getUint16(iovlOff + 10, false);
        canvasH = dv.getUint16(iovlOff + 12, false);
      }
    }
    // Fallback: ispe from iprp
    if (!canvasW || !canvasH) {
      const iprpBox = metaChildren.find(b => b.type === 'iprp');
      if (iprpBox) {
        const ipcoBox = parseHeifBoxes(buf, iprpBox.dataStart, iprpBox.dataEnd).find(b => b.type === 'ipco');
        if (ipcoBox) {
          const props = parseHeifBoxes(buf, ipcoBox.dataStart, ipcoBox.dataEnd);
          const ispe = props.find(b => b.type === 'ispe');
          if (ispe) {
            canvasW = dv.getUint32(ispe.dataStart + 4, false);
            canvasH = dv.getUint32(ispe.dataStart + 8, false);
          }
        }
      }
    }
    if (!canvasW || !canvasH) throw new Error('Cannot determine canvas size from .paint');

    // 6. Decode each layer (raw deflate BGRA → RGBA ImageData)
    const layerPixelArrays = [];
    for (const itemId of layerItemIds) {
      const loc = ilocMap[itemId];
      if (!loc || loc.extents.length === 0) {
        // Empty layer — push transparent
        layerPixelArrays.push(new Uint8ClampedArray(canvasW * canvasH * 4));
        continue;
      }
      const ext = loc.extents[0];
      const compressedU8 = new Uint8Array(buf, ext.off, ext.len);

      let bgraRaw;
      try {
        bgraRaw = pako.inflateRaw(compressedU8);
      } catch (e) {
        // Try zlib-wrapped deflate as fallback
        try { bgraRaw = pako.inflate(compressedU8); }
        catch (e2) { throw new Error(`Layer ${itemId} deflate error: ${e.message}`); }
      }

      // BGRA → RGBA
      const rgba = new Uint8ClampedArray(canvasW * canvasH * 4);
      for (let p = 0; p < canvasW * canvasH; p++) {
        rgba[p*4+0] = bgraRaw[p*4+2]; // R ← B slot
        rgba[p*4+1] = bgraRaw[p*4+1]; // G
        rgba[p*4+2] = bgraRaw[p*4+0]; // B ← R slot
        rgba[p*4+3] = bgraRaw[p*4+3]; // A
      }
      layerPixelArrays.push(rgba);
    }

    // 7. Apply to editor: resize canvas, replace layers
    const nLayers = layerPixelArrays.length;

    // Resize canvas pixel buffers if dimensions changed.
    // updateCanvasSize() only sets CSS zoom dimensions — we must also reset each
    // layer canvas's actual pixel width/height, otherwise putImageData into a
    // differently-sized buffer causes the distortion / coordinate mismatch.
    if (canvasW !== S.W || canvasH !== S.H) {
      S.W = canvasW; S.H = canvasH;
      // Resize every existing layer's pixel buffer
      S.layers.forEach(l => {
        l.canvas.width  = S.W;
        l.canvas.height = S.H;
      });
    }

    // Add layers if we need more than currently exist.
    // Use _addNewLayerDOM directly (not addLayer) to avoid saveHistory firing mid-import.
    while (S.layers.length < nLayers) _addNewLayerDOM(nextLayerName());
    // Remove excess layers — must remove from DOM too, not just the array
    while (S.layers.length > nLayers && S.layers.length > 1) {
      _removeTopLayerDOM();
    }

    // Draw pixel data into each layer
    for (let i = 0; i < nLayers; i++) {
      const ctx = S.layers[i].ctx;
      // Ensure this layer's canvas buffer matches the new size
      S.layers[i].canvas.width  = canvasW;
      S.layers[i].canvas.height = canvasH;
      const imgData = new ImageData(layerPixelArrays[i], canvasW, canvasH);
      ctx.putImageData(imgData, 0, 0);
      refreshLayerThumb(i);
    }

    // Re-fit zoom and re-centre — must happen after all layers exist so
    // updateCanvasSize() can set their CSS dimensions correctly.
    const area = canvasArea;
    const pad  = 120;
    S.zoom = Math.max(1, Math.min(
      Math.floor((area.clientWidth  - pad) / S.W),
      Math.floor((area.clientHeight - pad) / S.H)
    ));
    // Update canvas size inputs in the Canvas tab
    const wInput = document.getElementById('canvas-w-input');
    const hInput = document.getElementById('canvas-h-input');
    if (wInput) wInput.value = S.W;
    if (hInput) hInput.value = S.H;
    updateCanvasSize();   // sets canvasWrap + all layer CSS sizes
    centerCanvas();

    S.activeLayer = 0;
    syncLayerControls();
    renderLayerList();
    drawGrid();
    saveHistory();
    showToast(`.paint imported — ${nLayers} layer${nLayers > 1 ? 's' : ''}!`);

  } catch (err) {
    console.error('.paint import error:', err);
    showToast('Import failed: ' + err.message);
  }
}

// ── .PAINT EXPORT ───────────────────────────────────────────────────
async function exportPaint() {
  if (typeof pako === 'undefined') {
    showToast('pako library not loaded — cannot export .paint'); return;
  }

  const layers = S.layers;
  const N = layers.length;
  const W = S.W, H = S.H;

  // 1. Compress each layer: RGBA → BGRA → raw deflate
  const layerCompressed = [];
  for (const layer of layers) {
    const imgData = layer.ctx.getImageData(0, 0, W, H);
    const rgba = imgData.data; // Uint8ClampedArray, RGBA
    const bgra = new Uint8Array(W * H * 4);
    for (let p = 0; p < W * H; p++) {
      bgra[p*4+0] = rgba[p*4+2]; // B ← R slot
      bgra[p*4+1] = rgba[p*4+1]; // G
      bgra[p*4+2] = rgba[p*4+0]; // R ← B slot
      bgra[p*4+3] = rgba[p*4+3]; // A
    }
    layerCompressed.push(pako.deflateRaw(bgra, { level: 6 }));
  }

  // 2. Build Exif block (96 DPI, little-endian TIFF)
  const dpiBytes = new Uint8Array(8);
  new DataView(dpiBytes.buffer).setFloat64(0, 96.0, true); // little-endian double
  const exifTiff = concat(
    new Uint8Array([0x49, 0x49, 0x2A, 0x00]),  // 'II' + TIFF magic 42 LE
    u32be(8).reverse(),                          // IFD offset = 8 (LE)
    u16be(2).reverse(),                          // 2 IFD entries (LE)
    // XResolution: tag=282, type=12 (double), count=1, offset=38
    new Uint8Array([0x1A,0x01, 0x0C,0x00, 0x01,0x00,0x00,0x00, 0x26,0x00,0x00,0x00]),
    // YResolution: tag=283, type=12 (double), count=1, offset=46
    new Uint8Array([0x1B,0x01, 0x0C,0x00, 0x01,0x00,0x00,0x00, 0x2E,0x00,0x00,0x00]),
    new Uint8Array(4+6),  // next IFD=0 + 6 bytes padding to reach offset 38
    dpiBytes, dpiBytes    // XRes @ 38, YRes @ 46
  );
  const exifPayload = concat(new Uint8Array(4), exifTiff); // 4-byte prefix = 0

  // 3. iovl payload (in idat): background=white/transparent, canvas size, all layers at (0,0)
  const iovlPayload = concat(
    u16be(0),                                        // reserved
    u16be(0xFFFF), u16be(0xFFFF), u16be(0xFFFF), u16be(0x0000),  // RGBA fill: white transparent
    u16be(W), u16be(H),                              // canvas size (uint16 big-endian)
    ...Array.from({length: N}, () => concat(i16be(0), i16be(0)))  // layer offsets all (0,0)
  );
  const idatBox = makeBox('idat', iovlPayload);

  // 4. Build meta child boxes ────────────────────────────────────────
  // hdlr
  const hdlr = makeFullBox('hdlr', 0, 0, concat(
    new Uint8Array(4),         // pre_defined = 0
    str4('pict'),              // handler_type
    new Uint8Array(12),        // reserved
    new Uint8Array(1)          // name (empty, null-terminated)
  ));

  // pitm: primary item = iovl = item N+1
  const pitm = makeFullBox('pitm', 0, 0, u16be(N + 1));

  // iinf: N unci + 1 iovl + 1 Exif
  const infeBoxes = [];
  for (let i = 1; i <= N; i++) {
    infeBoxes.push(makeFullBox('infe', 2, 0,
      concat(u16be(i), u16be(0), str4('unci'), new Uint8Array(1))));
  }
  infeBoxes.push(makeFullBox('infe', 2, 0,
    concat(u16be(N+1), u16be(0), str4('iovl'), new Uint8Array(1))));
  infeBoxes.push(makeFullBox('infe', 2, 0,
    concat(u16be(N+2), u16be(0), str4('Exif'), new Uint8Array(1))));
  const iinf = makeFullBox('iinf', 0, 0,
    concat(u16be(N + 2), ...infeBoxes));

  // iref: iovl 'dimg' → layers 1..N, Exif 'cdsc' → iovl
  const dimgRefs = concat(
    u16be(N+1), u16be(N),
    ...Array.from({length: N}, (_, i) => u16be(i + 1))
  );
  const cdscRefs = concat(u16be(N+2), u16be(1), u16be(N+1));
  const iref = makeFullBox('iref', 0, 0,
    concat(makeBox('dimg', dimgRefs), makeBox('cdsc', cdscRefs)));

  // iprp
  const cmpC = makeFullBox('cmpC', 0, 0, concat(str4('defl'), new Uint8Array(1)));
  const ispe = makeFullBox('ispe', 0, 0, concat(u32be(W), u32be(H)));
  const colr = makeBox('colr',
    new Uint8Array([0x6E,0x63,0x6C,0x78, 0x00,0x01, 0x00,0x0D, 0x00,0x00, 0x80]));
  const cmpd = makeBox('cmpd',
    concat(u32be(4), u16be(4), u16be(5), u16be(6), u16be(7)));  // R,G,B,A component types
  // uncC: BGRA storage order (indices into cmpd: B=2, G=1, R=0, A=3)
  const uncCComps = concat(...[2,1,0,3].map(idx =>
    new Uint8Array([idx >> 8, idx & 0xFF, 7, 0, 0])  // index(2) + bit_depth_minus1(1) + fmt(1) + align(1)
  ));
  // Fix: index is uint16, need proper 2-byte encoding
  const uncCCompsFixed = concat(...[2,1,0,3].map(idx =>
    concat(u16be(idx), new Uint8Array([7, 0, 0]))
  ));
  const uncC = makeFullBox('uncC', 0, 0,
    concat(str4('gene'), u32be(4), uncCCompsFixed));
  const pixi = makeFullBox('pixi', 0, 0,
    concat(u32be(4), new Uint8Array([8,8,8,8])));
  const ipco = makeBox('ipco', concat(cmpC, ispe, colr, cmpd, uncC, pixi));

  // ipma: property indices (1-based)
  // unci items: cmpC(1), ispe(2), colr(3), cmpd(4), uncC(5), pixi(6)
  // iovl item: ispe(2), colr(3) only
  function ipmaEntry(itemId, assocs) {
    // assocs: [{essential, propIdx}]
    const bytes = [0, itemId & 0xFF, assocs.length]; // u16be item_id then count
    // Actually u16be for item_id:
    return concat(u16be(itemId), new Uint8Array([assocs.length,
      ...assocs.map(({e, p}) => ((e ? 0x80 : 0) | (p & 0x7F)))]));
  }
  const unciAssocs = [{e:1,p:1},{e:0,p:2},{e:0,p:3},{e:1,p:4},{e:1,p:5},{e:0,p:6}];
  const iovlAssocs = [{e:0,p:2},{e:0,p:3}];
  const ipmaEntries = concat(
    ...Array.from({length: N}, (_, i) => ipmaEntry(i+1, unciAssocs)),
    ipmaEntry(N+1, iovlAssocs)
  );
  const ipma = makeFullBox('ipma', 0, 0, concat(u32be(N + 1), ipmaEntries));
  const iprp = makeBox('iprp', concat(ipco, ipma));

  // 5. Build iloc with placeholder offsets, measure meta size, then fix up
  function buildIloc(items) {
    // items: [{id, cm, extents:[{off,len}]}]
    // v1, offset_size=4, length_size=4, base_offset_size=0, index_size=0
    let payload = concat(
      new Uint8Array([0x44, 0x00]),  // offsetSz=4, lenSz=4 | baseOffSz=0, idxSz=0
      u16be(items.length)
    );
    for (const item of items) {
      payload = concat(payload,
        u16be(item.id),
        u16be(item.cm),  // construction_method
        u16be(0),        // data_ref_index
        u16be(item.extents.length),
        ...item.extents.map(({off, len}) => concat(u32be(off), u32be(len)))
      );
    }
    return makeFullBox('iloc', 1, 0, payload);
  }

  // Dummy iloc to measure sizes
  const dummyIlocItems = [
    ...layerCompressed.map((c, i) => ({id: i+1, cm: 0, extents: [{off: 0, len: c.length}]})),
    {id: N+1, cm: 1, extents: [{off: 0, len: iovlPayload.length}]},
    {id: N+2, cm: 0, extents: [{off: 0, len: exifPayload.length}]},
  ];
  const dummyIloc = buildIloc(dummyIlocItems);

  const metaContent = concat(hdlr, pitm, iinf, dummyIloc, iprp, iref, idatBox);
  const metaDummy   = makeFullBox('meta', 0, 0, metaContent);

  // ftyp
  const ftyp = makeBox('ftyp', concat(
    str4('mif1'), new Uint8Array(4),  // brand, minor_version
    str4('mif1'), str4('gcmi'), str4('isoa'), str4('miaf')
  ));

  // free (padding)
  const free = makeBox('free', new Uint8Array(56));

  // Compute mdat offset and actual item offsets
  const mdatOffset = ftyp.length + metaDummy.length + free.length;
  let pos = mdatOffset + 8; // skip mdat box header
  const layerOffsets = [];
  for (const c of layerCompressed) { layerOffsets.push(pos); pos += c.length; }
  const exifOffset = pos;

  // Real iloc
  const realIlocItems = [
    ...layerCompressed.map((c, i) => ({id: i+1, cm: 0, extents: [{off: layerOffsets[i], len: c.length}]})),
    {id: N+1, cm: 1, extents: [{off: 0, len: iovlPayload.length}]},
    {id: N+2, cm: 0, extents: [{off: exifOffset, len: exifPayload.length}]},
  ];
  const realIloc = buildIloc(realIlocItems);
  if (realIloc.length !== dummyIloc.length) {
    showToast('Internal error: iloc size mismatch'); return;
  }

  const metaFinal = makeFullBox('meta', 0, 0,
    concat(hdlr, pitm, iinf, realIloc, iprp, iref, idatBox));
  const mdat = makeBox('mdat', concat(...layerCompressed, exifPayload));

  const paintBytes = concat(ftyp, metaFinal, free, mdat);

  // 6. Download
  const blob = new Blob([paintBytes], {type: 'image/heif'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'pixel-art.paint'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  showToast(`.paint exported — ${N} layer${N > 1 ? 's' : ''}!`);
}

async function copyClipboard(){
  flattenToCanvas().toBlob(async blob=>{
    try{ await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]); showToast('Copied to clipboard!'); }
    catch{ showToast('Clipboard unavailable'); }
  });
}
document.getElementById('btn-export').addEventListener('click',exportPNG);
document.getElementById('btn-export2').addEventListener('click',exportPNG);
document.getElementById('btn-copy').addEventListener('click',copyClipboard);
document.getElementById('btn-clear').addEventListener('click',()=>{
  const ctx=activeCtx(); if(ctx){ ctx.clearRect(0,0,S.W,S.H); refreshLayerThumb(S.activeLayer); saveHistory(); }
});

// ═══════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  const k=e.key.toLowerCase();
  const toolMap={p:'pencil',e:'eraser',f:'fill',i:'eyedropper',l:'line',r:'rect',o:'ellipse',s:'select'};
  if(toolMap[k]){
    S.tool=toolMap[k];
    document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===S.tool));
    updateToolConfigVisibility();
  }
  if((e.ctrlKey||e.metaKey)&&k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); }
  if((e.ctrlKey||e.metaKey)&&k==='y'){ e.preventDefault(); redo(); }
  if((e.ctrlKey||e.metaKey)&&k==='s'){ e.preventDefault(); exportPNG(); }
  if(k==='+'||k==='=') setZoom(S.zoom+2);
  if(k==='-') setZoom(S.zoom-2);
  if(k==='escape'&&S.placing) cancelPlacing();
  if(k==='enter'&&S.placing) stampImage();
});

// ═══════════════════════════════════════════
// UNDO / REDO BUTTONS
// ═══════════════════════════════════════════
document.getElementById('btn-undo').addEventListener('click',undo);
document.getElementById('btn-redo').addEventListener('click',redo);

// ═══════════════════════════════════════════
// .PAINT IMPORT / EXPORT BUTTON WIRING
// ═══════════════════════════════════════════
function triggerPaintImport() { document.getElementById('paint-input').click(); }
document.getElementById('btn-import-paint').addEventListener('click', triggerPaintImport);
document.getElementById('btn-import-paint2').addEventListener('click', triggerPaintImport);
document.getElementById('btn-export-paint').addEventListener('click', exportPaint);
document.getElementById('btn-export-paint2').addEventListener('click', exportPaint);

document.getElementById('paint-input').addEventListener('change', function() {
  if (this.files[0]) importPaintFile(this.files[0]);
  this.value = '';
});

// Drop .paint files onto the canvas
document.getElementById('canvas-area').addEventListener('drop', e => {
  const file = e.dataTransfer?.files?.[0];
  if (file && (file.name.toLowerCase().endsWith('.paint') ||
               file.type === 'image/heic' || file.type === 'image/heif')) {
    e.preventDefault(); e.stopImmediatePropagation();
    importPaintFile(file);
  }
}, true);

// ═══════════════════════════════════════════
// MOBILE DRAWER
// ═══════════════════════════════════════════
const rightPanel   = document.getElementById('right-panel');
const drawerHandle = document.getElementById('drawer-handle');
const drawerSpacer = document.getElementById('drawer-spacer');

function isMobile(){ return window.innerWidth <= 640; }

function setDrawer(open){
  if(!isMobile()) return;
  rightPanel.classList.toggle('drawer-open', open);
  // spacer height = collapsed drawer height (48px) always present
  drawerSpacer.style.display = 'block';
}

// Tap the handle pill → toggle
drawerHandle.addEventListener('click', ()=>{
  if(!isMobile()) return;
  setDrawer(!rightPanel.classList.contains('drawer-open'));
});

// Also open drawer when a panel tab is tapped on mobile
document.querySelectorAll('.panel-tab').forEach(btn=>{
  btn.addEventListener('click',()=>{ if(isMobile()) setDrawer(true); });
});

// Touch swipe on the handle area: swipe up = open, swipe down = close
let swipeStartY=0;
drawerHandle.addEventListener('touchstart',e=>{ swipeStartY=e.touches[0].clientY; },{passive:true});
drawerHandle.addEventListener('touchend',e=>{
  if(!isMobile()) return;
  const dy=swipeStartY-e.changedTouches[0].clientY;
  if(dy>20) setDrawer(true);
  else if(dy<-20) setDrawer(false);
},{passive:true});

// On resize: reset drawer state if going desktop
window.addEventListener('resize',()=>{
  if(!isMobile()){
    rightPanel.classList.remove('drawer-open');
    drawerSpacer.style.display='none';
  } else {
    drawerSpacer.style.display='block';
  }
});

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
function init(){
  _addNewLayerDOM('Background');
  S.activeLayer=0;
  updateCanvasSize();
  renderLayerList();
  syncLayerControls();
  renderPalette();
  setFg('#000000'); setBg('#ffffff');
  updateToolConfigVisibility();
  saveHistory();
  setTimeout(()=>{
    const a=document.getElementById('canvas-area');
    const pad = 120;
    S.zoom = Math.max(4, Math.min(Math.floor((a.clientWidth-pad)/S.W), Math.floor((a.clientHeight-pad)/S.H)));
    updateCanvasSize();
    zoomBadge.textContent = Math.round(S.zoom*10)+'%';
    centerCanvas();
    // On mobile: show spacer (drawer is collapsed by default, user can swipe up)
    if(isMobile()){
      drawerSpacer.style.display='block';
    }
  },60);
}
init();
