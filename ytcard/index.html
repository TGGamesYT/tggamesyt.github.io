<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Post Card Generator</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#111827;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:36px 16px;gap:24px}
  h1{color:#fff;font-size:1.35rem;font-weight:700;letter-spacing:-.02em;text-align:center}
  h1 em{color:#ff4444;font-style:normal}

  .panel{background:#1c1c1c;border:1.5px solid #2e2e2e;border-radius:16px;padding:24px;width:100%;max-width:540px;display:flex;flex-direction:column;gap:14px}
  .panel-title{color:#777;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .hint{color:#555;font-size:.78rem;line-height:1.5}
  .hint code{color:#888;background:#222;padding:1px 5px;border-radius:4px;font-size:.75rem}

  .row{display:flex;gap:8px}
  input,textarea{flex:1;background:#111;border:1.5px solid #2a2a2a;border-radius:9px;color:#e0e0e0;font-size:.9rem;padding:9px 13px;outline:none;font-family:inherit;transition:border-color .15s}
  input:focus,textarea:focus{border-color:#ff4444}
  input::placeholder,textarea::placeholder{color:#3a3a3a}
  textarea{resize:vertical;line-height:1.5}

  .cols{display:flex;gap:10px}
  .cols .field{flex:1;display:flex;flex-direction:column;gap:5px}
  label{color:#666;font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase}

  btn,button{border:none;border-radius:9px;cursor:pointer;font-family:inherit;font-weight:700;transition:background .15s,transform .1s}
  button:active{transform:scale(.97)}
  .btn-red{background:#e03333;color:#fff;font-size:.88rem;padding:9px 18px;white-space:nowrap}
  .btn-red:hover{background:#c82b2b}
  .btn-red:disabled{background:#444;cursor:not-allowed}
  .btn-gray{background:#252525;border:1.5px solid #383838;color:#bbb;font-size:.85rem;padding:9px 18px}
  .btn-gray:hover{background:#2e2e2e;color:#fff}

  .status{font-size:.8rem;min-height:17px;transition:color .2s}
  .s-idle{color:#555}.s-busy{color:#f59e0b}.s-ok{color:#34d399}.s-err{color:#f87171}

  .divider{display:flex;align-items:center;gap:10px;color:#333;font-size:.75rem}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:#262626}

  /* ── CARD ── */
  #out{display:none;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:520px}
  .out-label{color:#444;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase}

  .yt-card{
    background:#1e1e1e;
    border:2px solid #3a3a3a;
    border-radius:16px;
    box-shadow:6px 6px 0 rgba(0,0,0,.8);
    width:100%;
    padding:16px 16px 12px;
    font-family:'Roboto','Segoe UI',sans-serif;
    color:#fff;
  }
  .yt-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .yt-av{
    width:38px;height:38px;border-radius:50%;
    background:linear-gradient(135deg,#e03333,#7a1111);
    display:flex;align-items:center;justify-content:center;
    font-size:.95rem;font-weight:700;color:#fff;
    flex-shrink:0;overflow:hidden;
  }
  .yt-av img{width:100%;height:100%;object-fit:cover}
  .yt-meta{flex:1;min-width:0}
  .yt-name{
    font-size:.9rem;font-weight:700;color:#fff;
    display:flex;align-items:center;gap:4px;
    line-height:1.2;
  }
  /* verified badge — hidden by default, shown via JS */
  .yt-check{width:13px;height:13px;fill:#aaaaaa;display:none;flex-shrink:0}
  .yt-check.visible{display:inline-block}
  .yt-date{font-size:.72rem;color:#909090;margin-top:2px}
  .yt-dots{color:#777;font-size:1.4rem;line-height:1;padding:2px 4px;cursor:default;flex-shrink:0;letter-spacing:1px}

  /* post body — white text, YouTube uses ~14px */
  .yt-body{
    font-size:.88rem;color:#f1f1f1;
    line-height:1.6;white-space:pre-wrap;word-break:break-word;
    margin-bottom:12px;
  }

  /* post image — full natural size, rounded corners */
  .yt-img{
    width:100%;border-radius:10px;display:block;
    background:#2a2a2a;
  }
  #c-img:not(:empty){margin-bottom:10px}

  /* action bar — no separator, just spacing */
  .yt-bar{
    display:flex;align-items:center;gap:0;
    padding-top:10px;
  }
  /* like group: thumbs-up + count + divider + thumbs-down all in one rounded pill */
  .yt-like-pill{
    display:flex;align-items:center;gap:0;
    background:#272727;
    border-radius:20px;overflow:hidden;
  }
  .yt-like-btn{
    display:flex;align-items:center;gap:6px;
    padding:6px 12px;color:#f1f1f1;
    font-size:.8rem;font-weight:500;cursor:default;
  }
  .yt-like-btn svg{width:18px;height:18px;fill:currentColor;flex-shrink:0}
  .yt-like-divider{width:1px;background:#3d3d3d;height:18px;flex-shrink:0}
  .yt-dislike-btn{
    display:flex;align-items:center;
    padding:6px 12px;color:#f1f1f1;cursor:default;
  }
  .yt-dislike-btn svg{width:18px;height:18px;fill:currentColor}

  /* share button */
  .yt-share-btn{
    display:flex;align-items:center;gap:6px;
    background:#272727;border-radius:20px;
    padding:6px 14px;color:#f1f1f1;
    font-size:.8rem;font-weight:500;cursor:default;
    margin-left:8px;
  }
  .yt-share-btn svg{width:18px;height:18px;fill:currentColor}

  /* spinner */
  .spin{display:inline-block;width:11px;height:11px;border:2px solid #444;border-top-color:#f59e0b;border-radius:50%;animation:sp .65s linear infinite;vertical-align:middle;margin-right:4px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<h1>YouTube Post Card <em>●</em> Generator</h1>

<div class="panel">
  <div class="panel-title">Step 1 — Paste Post URL or Channel Handle</div>
  <p class="hint">Post URL: <code>youtube.com/post/Ugkx…</code> &nbsp;·&nbsp; or channel: <code>@knarfy</code> to list recent posts</p>
  <div class="row">
    <input id="url-in" type="text" placeholder="https://www.youtube.com/post/Ugkx...  or  @knarfy" />
    <button class="btn-red" id="load-btn">Load</button>
  </div>
  <div class="status s-idle" id="st"></div>
</div>

<!-- post picker (shown when channel handle given) -->
<div class="panel" id="picker-panel" style="display:none">
  <div class="panel-title">Step 2 — Pick a Post</div>
  <div id="picker-list" style="display:flex;flex-direction:column;gap:8px"></div>
</div>

<div class="panel">
  <div class="divider">or fill in manually</div>
  <div class="cols">
    <div class="field"><label>Channel name</label><input id="m-ch" placeholder="Knarfy"/></div>
    <div class="field"><label>Likes</label><input id="m-lk" placeholder="13K" style="max-width:90px"/></div>
  </div>
  <div class="field" style="display:flex;flex-direction:column;gap:5px">
    <label>Post text</label>
    <textarea id="m-tx" rows="4" placeholder="What's a super sick PvP item you'd like to see…"></textarea>
  </div>
  <div class="cols">
    <div class="field"><label>Date</label><input id="m-dt" placeholder="2 days ago"/></div>
    <div class="field"><label>Image URL (opt.)</label><input id="m-im" placeholder="https://…"/></div>
  </div>
  <button class="btn-red" id="manual-btn">Generate Card</button>
</div>

<!-- output -->
<div id="out">
  <div class="out-label">Your card</div>
  <div class="yt-card" id="yt-card">
    <div class="yt-head">
      <div class="yt-av" id="c-av"><span id="c-lt">K</span></div>
      <div class="yt-meta">
        <div class="yt-name" id="c-nm">
          <span id="c-ch">Knarfy</span>
          <!-- verified checkmark — hidden unless channel has it -->
          <svg id="c-check" class="yt-check" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        <div class="yt-date" id="c-dt">2 days ago</div>
      </div>
      <div class="yt-dots">⋮</div>
    </div>
    <div class="yt-body" id="c-tx"></div>
    <div id="c-img"></div>
    <div class="yt-bar">
      <!-- like+dislike as one joined pill, matching YouTube's UI -->
      <div class="yt-like-pill">
        <div class="yt-like-btn">
          <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
          <span id="c-lk">13K</span>
        </div>
        <div class="yt-like-divider"></div>
        <div class="yt-dislike-btn">
          <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
        </div>
      </div>
      <!-- share button -->
      <div class="yt-share-btn">
        <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
        Share
      </div>
    </div>
  </div>
  <button class="btn-gray" id="dl-btn">⬇ Download PNG</button>
</div>

<script>
// ── helpers ──
const $  = id => document.getElementById(id);
const st = (msg, cls) => { $('st').textContent = msg; $('st').className = 'status ' + cls; };

// CORS proxies to try in order
const PROXIES = [
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
];

async function fetchViaProxy(url) {
  for (const proxy of PROXIES) {
    try {
      const r = await fetch(proxy(url), { headers: { 'x-requested-with': 'XMLHttpRequest' } });
      if (r.ok) {
        const text = await r.text();
        if (text.length > 200) return text; // got real content
      }
    } catch(e) { /* try next */ }
  }
  throw new Error('All proxies failed — check your connection or fill in manually below.');
}

// ── InnerTube API: fetch channel community posts by channel ID ──
// Uses YouTube's internal browse API (no key needed, just a client context)
async function innerTubeBrowse(channelId) {
  const body = {
    context: {
      client: { clientName: 'WEB', clientVersion: '2.20240101.00.00', hl: 'en', gl: 'US' }
    },
    browseId: channelId,
    params: 'Egljb21tdW5pdHkYAyAB' // base64 for community tab
  };
  // InnerTube endpoint — no API key needed for browse
  const url = 'https://www.youtube.com/youtubei/v1/browse?prettyPrint=false';
  const text = await fetchViaProxy(url + '&__=' + Date.now());
  // fallback: POST isn't possible via simple proxy GET, so fetch the HTML page instead
  throw new Error('USE_HTML');
}

// ── Parse ytInitialData from HTML page ──
function parseInitialData(html) {
  const m = html.match(/ytInitialData\s*=\s*(\{[\s\S]*?\});\s*(?:var |<\/script>|window\[)/);
  if (!m) return null;
  try { return JSON.parse(m[1]); } catch(e) {
    // try a bigger chunk
    const start = html.indexOf('ytInitialData = ') + 16;
    const chunk = html.slice(start, start + 2000000);
    const end = chunk.lastIndexOf('};') + 2;
    try { return JSON.parse(chunk.slice(0, end)); } catch(e2) { return null; }
  }
}

function deepFind(obj, key, _depth=0) {
  if (_depth > 30 || !obj || typeof obj !== 'object') return undefined;
  if (key in obj) return obj[key];
  for (const v of Object.values(obj)) {
    const f = deepFind(v, key, _depth + 1);
    if (f !== undefined) return f;
  }
}

function deepFindAll(obj, key, results=[], _depth=0) {
  if (_depth > 30 || !obj || typeof obj !== 'object') return results;
  if (key in obj) results.push(obj[key]);
  for (const v of Object.values(obj)) deepFindAll(v, key, results, _depth + 1);
  return results;
}

function getText(obj) {
  if (!obj) return '';
  if (typeof obj === 'string') return obj;
  if (obj.simpleText) return obj.simpleText;
  if (obj.runs) return obj.runs.map(r => r.text || '').join('');
  return '';
}

function parsePostRenderer(p) {
  const text = getText(p.contentText || p.content || {});
  const channel = getText(p.authorText || p.displayName || {});
  const date = getText(p.publishedTimeText || {});
  const likes = getText(p.voteCount || p.likeCount || {});
  const avatarThumbs = (p.authorThumbnail || p.avatar || {}).thumbnails || [];
  const avatarUrl = avatarThumbs.length ? avatarThumbs[avatarThumbs.length-1].url : '';
  const imgRenderer = deepFind(p, 'backstageImageRenderer') || deepFind(p, 'postImageRenderer');
  const imgThumbs = (imgRenderer?.image?.thumbnails) || [];
  const imageUrl = imgThumbs.length ? imgThumbs[imgThumbs.length-1].url : '';
  // verified = channel has a badge in the author badges array
  const badges = p.authorBadges || [];
  const verified = badges.some(b =>
    b?.metadataBadgeRenderer?.style?.toLowerCase().includes('verified') ||
    b?.metadataBadgeRenderer?.icon?.iconType === 'CHECK_CIRCLE_THICK'
  );
  return { text, channel, date, likes, avatarUrl, imageUrl, verified };
}

// ── resolve handle → channel ID via YouTube search page ──
async function resolveHandle(handle) {
  st('Looking up channel…', 's-busy');
  const cleanHandle = handle.startsWith('@') ? handle : '@' + handle;
  const html = await fetchViaProxy(`https://www.youtube.com/${cleanHandle}/community`);
  return html; // return the community page HTML directly
}

// ── main load handler ──
$('load-btn').addEventListener('click', async () => {
  const val = $('url-in').value.trim();
  if (!val) return;
  $('load-btn').disabled = true;
  $('picker-panel').style.display = 'none';

  try {
    // detect: post URL or channel handle
    const isPostUrl = val.includes('/post/') || val.includes('community?lb=');
    const isHandle  = val.startsWith('@') || (!val.includes('/') && !val.includes('.'));
    const isChannelUrl = val.includes('youtube.com/') && !isPostUrl;

    if (isPostUrl) {
      st('Fetching post…', 's-busy');
      const postUrl = val.startsWith('http') ? val : 'https://www.youtube.com/post/' + val;
      const html = await fetchViaProxy(postUrl);
      const yt = parseInitialData(html);
      if (!yt) throw new Error('Could not parse page. Try the manual form below.');

      const postRenderers = deepFindAll(yt, 'backstagePostRenderer');
      if (!postRenderers.length) throw new Error('No post found on page. Try the manual form.');

      const d = parsePostRenderer(postRenderers[0]);
      if (!d.text && !d.channel) throw new Error('Post data empty. Try the manual form.');
      prefillManual(d);
      renderCard(d);
      st('✓ Post loaded!', 's-ok');

    } else {
      // channel handle or URL — load community tab and list posts
      st('Fetching community posts…', 's-busy');
      const handle = isHandle ? val : val.replace(/https?:\/\/(www\.)?youtube\.com\//,'').split('/')[0];
      const cleanHandle = handle.startsWith('@') ? handle : '@' + handle;
      const html = await fetchViaProxy(`https://www.youtube.com/${cleanHandle}/community`);
      const yt = parseInitialData(html);
      if (!yt) throw new Error('Could not parse page data.');

      const postRenderers = deepFindAll(yt, 'backstagePostRenderer');
      if (!postRenderers.length) throw new Error('No community posts found for this channel, or the channel doesn\'t have a Posts tab.');

      st(`✓ Found ${postRenderers.length} posts — pick one below`, 's-ok');
      showPicker(postRenderers);
    }

  } catch(e) {
    st('✗ ' + e.message, 's-err');
  }

  $('load-btn').disabled = false;
});

function showPicker(renderers) {
  const list = $('picker-list');
  list.innerHTML = '';
  renderers.slice(0, 8).forEach((p, i) => {
    const d = parsePostRenderer(p);
    const btn = document.createElement('button');
    btn.className = 'btn-gray';
    btn.style.cssText = 'text-align:left;border-radius:10px;padding:10px 13px;font-weight:400;font-size:.83rem;line-height:1.4;color:#ccc';
    const preview = (d.text || '(no text)').slice(0, 130);
    btn.textContent = preview + (d.text.length > 130 ? '…' : '');
    btn.onclick = () => {
      prefillManual(d);
      renderCard(d);
      $('picker-panel').style.display = 'none';
      $('out').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    list.appendChild(btn);
  });
  $('picker-panel').style.display = 'flex';
  $('picker-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function prefillManual(d) {
  if (d.channel) $('m-ch').value = d.channel;
  if (d.text)    $('m-tx').value = d.text;
  if (d.likes)   $('m-lk').value = d.likes;
  if (d.date)    $('m-dt').value = d.date;
  if (d.imageUrl) $('m-im').value = d.imageUrl;
}

// ── render card ──
function renderCard(d) {
  const ch = d.channel || $('m-ch').value || 'Unknown';
  $('c-ch').textContent = ch;
  $('c-lt').textContent = ch[0]?.toUpperCase() || '?';
  $('c-dt').textContent = d.date  || $('m-dt').value || '';
  $('c-tx').textContent = d.text  || $('m-tx').value || '';
  $('c-lk').textContent = d.likes || $('m-lk').value || '0';

  // verified checkmark — only show if data says verified
  const check = $('c-check');
  if (d.verified) check.classList.add('visible');
  else check.classList.remove('visible');

  // avatar
  const av = $('c-av');
  av.querySelector('img')?.remove();
  $('c-lt').style.display = '';
  if (d.avatarUrl) {
    const img = document.createElement('img');
    img.src = d.avatarUrl;
    img.crossOrigin = 'anonymous';
    img.onload = () => { $('c-lt').style.display = 'none'; };
    av.prepend(img);
  }

  // post image
  const wrap = $('c-img');
  wrap.innerHTML = '';
  const imgUrl = d.imageUrl || $('m-im').value;
  if (imgUrl) {
    const img = document.createElement('img');
    img.className = 'yt-img';
    img.src = imgUrl;
    img.crossOrigin = 'anonymous';
    wrap.appendChild(img);
  }

  $('out').style.display = 'flex';
  setTimeout(() => $('out').scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

// ── manual generate ──
$('manual-btn').addEventListener('click', () => {
  const text = $('m-tx').value.trim();
  if (!text && !$('m-ch').value.trim()) { alert('Fill in at least a channel name or post text.'); return; }
  renderCard({
    channel: $('m-ch').value.trim(),
    text,
    likes:    $('m-lk').value.trim(),
    date:     $('m-dt').value.trim(),
    imageUrl: $('m-im').value.trim(),
  });
});

// ── download PNG ──
$('dl-btn').addEventListener('click', async () => {
  const btn = $('dl-btn');
  btn.disabled = true; btn.textContent = 'Rendering…';
  if (!window.html2canvas) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  const canvas = await html2canvas($('yt-card'), { backgroundColor: null, scale: 2, useCORS: true, allowTaint: false });
  const a = document.createElement('a');
  a.download = 'yt-post-card.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
  btn.disabled = false; btn.textContent = '⬇ Download PNG';
});

$('url-in').addEventListener('keydown', e => { if (e.key === 'Enter') $('load-btn').click(); });
</script>
</body>
</html>
