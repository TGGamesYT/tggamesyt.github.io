<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pack.mcmeta generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0e0e16;
    --bg-panel:  #14141f;
    --bg-input:  #1c1c2a;
    --border:    #2a2a3d;
    --border-hi: #3d3d5c;
    --green:     #4cff72;
    --green-dim: #2a8f42;
    --text:      #e8e8f0;
    --text-dim:  #7878a0;
    --text-muted:#4a4a68;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'Inter', system-ui, sans-serif;
    --radius:    6px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-panel);
  }

  header h1 {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    color: var(--green);
    letter-spacing: -0.02em;
  }

  header p {
    font-size: 12px;
    color: var(--text-dim);
    margin-left: auto;
  }

  main {
    display: grid;
    grid-template-columns: 320px 1fr;
    min-height: 0;
  }

  .inputs {
    border-right: 1px solid var(--border);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: var(--bg-panel);
  }

  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    margin-bottom: 7px;
    text-transform: uppercase;
  }

  textarea {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 9px 11px;
    transition: border-color .15s;
    outline: none;
    resize: vertical;
    min-height: 80px;
    line-height: 1.6;
  }

  textarea:focus { border-color: var(--green-dim); }

  .hint {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 5px;
    line-height: 1.5;
  }

  .dl-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 11px;
    background: var(--green);
    color: #0a0a12;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    margin-top: auto;
  }
  .dl-btn:hover { opacity: .88; }
  .dl-btn:active { transform: scale(.98); }

  .output {
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  .output-bar {
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-panel);
    flex-shrink: 0;
  }

  .tab {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tab .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
  }

  .copy-btn {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 12px;
    background: transparent;
    border: 1px solid var(--border-hi);
    border-radius: var(--radius);
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .copy-btn:hover { border-color: var(--green-dim); color: var(--green); }
  .copy-btn.ok { border-color: var(--green); color: var(--green); }

  .code-wrap {
    flex: 1;
    overflow: auto;
    padding: 28px 32px;
  }

  pre {
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.85;
    color: var(--text);
    white-space: pre;
  }

  .k  { color: var(--text-dim); }
  .s  { color: #a8d8a8; }
  .n  { color: #7ec8e3; }
  .p  { color: var(--text-muted); }
  .ki { color: var(--green); font-weight: 600; }

  footer {
    border-top: 1px solid var(--border);
    padding: 10px 24px;
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg-panel);
    text-align: right;
  }

  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; }
    .inputs { border-right: none; border-bottom: 1px solid var(--border); }
    header p { display: none; }
    .code-wrap { padding: 18px; }
    .dl-btn { margin-top: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" style="width:28px;height:28px;image-rendering:pixelated;flex-shrink:0">
      <rect width="16" height="16" fill="#8B6914"/>
      <rect x="0" y="0" width="16" height="5" fill="#5aaa30"/>
      <rect x="0" y="0" width="2" height="2" fill="#6abf38"/>
      <rect x="3" y="0" width="1" height="1" fill="#4a9428"/>
      <rect x="5" y="1" width="2" height="1" fill="#6abf38"/>
      <rect x="9" y="0" width="2" height="2" fill="#4a9428"/>
      <rect x="13" y="1" width="2" height="1" fill="#6abf38"/>
      <rect x="1" y="5" width="14" height="1" fill="#7a5c10"/>
    </svg>
    <h1>pack.mcmeta generator</h1>
    <p>Resource &amp; data pack tool</p>
  </header>

  <main>
    <div class="inputs">
      <div class="field">
        <label>Description</label>
        <textarea id="desc" placeholder="My awesome resource pack" spellcheck="false"></textarea>
        <p class="hint">Supports §color codes and §lformatting.</p>
      </div>

      <button class="dl-btn" onclick="downloadFile()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M7 1v8M4 6l3 3 3-3M2 11h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Download pack.mcmeta
      </button>
    </div>

    <div class="output">
      <div class="output-bar">
        <div class="tab">
          <span class="dot"></span>
          pack.mcmeta
        </div>
        <button class="copy-btn" id="copy-btn" onclick="copyOutput()">copy</button>
      </div>
      <div class="code-wrap">
        <pre id="code-output"></pre>
      </div>
    </div>
  </main>

  <footer>pack.mcmeta generator &mdash; Java Edition resource &amp; data packs</footer>
</div>

<script>
function escStr(s) {
  return s.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
}

function buildJSON() {
  const desc = document.getElementById("desc").value;
  return `{\n  "pack": {\n    "description": "${escStr(desc)}",\n    "pack_format": 15,\n    "supported_formats": {"min_inclusive": 15, "max_inclusive": 999},\n    "min_format": 15,\n    "max_format": 999\n  }\n}`;
}

function hl(json) {
  return json
    .replace(/(\"(?:description|pack_format|supported_formats|pack|min_inclusive|max_inclusive|min_format|max_format)\")\s*:/g, (_, k) => {
      const hi = ["description","pack_format","supported_formats","min_format","max_format"];
      return `<span class="${hi.includes(k.slice(1,-1)) ? 'ki' : 'k'}">${k}</span><span class="p">:</span>`;
    })
    .replace(/:\s*"([^"]*)"/g, (_, v) => `: <span class="s">"${v}"</span>`)
    .replace(/:\s*(\d+)/g, (_, n) => `: <span class="n">${n}</span>`)
    .replace(/[{}]/g, m => `<span class="p">${m}</span>`);
}

function render() {
  document.getElementById("code-output").innerHTML = hl(buildJSON());
}

function copyOutput() {
  navigator.clipboard.writeText(buildJSON()).then(() => {
    const btn = document.getElementById("copy-btn");
    btn.textContent = "copied!";
    btn.classList.add("ok");
    setTimeout(() => { btn.textContent = "copy"; btn.classList.remove("ok"); }, 1800);
  });
}

function downloadFile() {
  const blob = new Blob([buildJSON()], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "pack.mcmeta"; a.click();
  URL.revokeObjectURL(url);
}

document.getElementById("desc").addEventListener("input", render);
render();
</script>
</body>
</html>
