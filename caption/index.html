<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Caption Tool</title>
<style>
  @font-face {
    font-family: 'Minecraft';
    src: url('https://tggamesyt.dev/assets/Minecraft-Seven_v2.ttf') format('truetype');
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1a;
    color: #e0e0e0;
    font-family: 'Minecraft', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    gap: 20px;
  }

  h1 {
    font-size: 22px;
    color: #fff;
    text-shadow: 3px 3px 0 #555;
    letter-spacing: 1px;
  }

  .panel {
    background: #2a2a2a;
    border: 2px solid #444;
    border-radius: 4px;
    padding: 20px 24px;
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  label {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
    display: block;
  }

  .drop-zone {
    border: 2px dashed #555;
    border-radius: 4px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    font-size: 13px;
    color: #777;
    position: relative;
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: #888; background: #333; color: #bbb; }
  .drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .drop-zone .filename { color: #ccc; font-size: 11px; margin-top: 5px; }

  textarea, input[type="text"], input[type="number"], input[type="range"], select {
    background: #1a1a1a;
    border: 2px solid #444;
    border-radius: 4px;
    color: #fff;
    font-family: 'Minecraft', monospace;
    font-size: 13px;
    padding: 8px 10px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }
  textarea { resize: vertical; min-height: 50px; }
  textarea:focus, input:focus, select:focus { border-color: #777; }

  input[type="color"] {
    background: #1a1a1a;
    border: 2px solid #444;
    border-radius: 4px;
    width: 48px;
    height: 36px;
    padding: 2px;
    cursor: pointer;
  }

  input[type="range"] { padding: 0; height: 6px; cursor: pointer; accent-color: #888; }

  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row > div { flex: 1; }
  .row.triple > div { flex: 1; }

  .color-row { display: flex; gap: 8px; align-items: center; }
  .color-row input[type="color"] { flex-shrink: 0; }
  .color-row input[type="text"] { flex: 1; }

  button {
    font-family: 'Minecraft', monospace;
    font-size: 13px;
    background: #3a3a3a;
    color: #fff;
    border: 2px solid #666;
    border-radius: 4px;
    padding: 9px 20px;
    cursor: pointer;
    text-shadow: 2px 2px 0 #222;
    transition: background 0.1s, border-color 0.1s;
    white-space: nowrap;
  }
  button:hover { background: #4a4a4a; border-color: #999; }
  button:active { background: #222; }

  .btn-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* Advanced panel */
  .advanced-panel {
    display: none;
    flex-direction: column;
    gap: 14px;
    border-top: 2px solid #333;
    padding-top: 14px;
    margin-top: 2px;
  }
  .advanced-panel.open { display: flex; }

  .adv-toggle {
    background: transparent;
    border: 2px solid #444;
    color: #888;
    font-size: 12px;
    padding: 6px 14px;
    align-self: flex-start;
  }
  .adv-toggle:hover { border-color: #666; color: #bbb; background: transparent; }

  .section-title {
    font-size: 11px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 2px;
    border-bottom: 1px solid #333;
    padding-bottom: 4px;
    margin-bottom: 2px;
  }

  .range-row { display: flex; gap: 10px; align-items: center; }
  .range-row input[type="range"] { flex: 1; }
  .range-val { min-width: 36px; text-align: right; font-size: 12px; color: #aaa; }

  .output-wrap {
    width: 100%;
    max-width: 700px;
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  .output-wrap.visible { display: flex; }

  canvas { display: none; }

  .preview { width: 100%; border: 2px solid #444; border-radius: 4px; display: block; }

  .error { color: #f66; font-size: 12px; display: none; }
  .error.visible { display: block; }

  .dl-btn { align-self: flex-end; }
</style>
</head>
<body>

<h1>Minecraft Caption Tool</h1>

<div class="panel">
  <!-- Image upload -->
  <div>
    <label>Image</label>
    <div class="drop-zone" id="dropZone">
      Drop image here or click to upload
      <div class="filename" id="filename"></div>
      <input type="file" id="fileInput" accept="image/*">
    </div>
  </div>

  <!-- Caption text -->
  <div>
    <label>Caption Text</label>
    <textarea id="captionText" placeholder='caption here' rows="2"></textarea>
  </div>

  <!-- Advanced toggle -->
  <button class="adv-toggle" id="advToggle">⚙ Advanced</button>

  <!-- Advanced panel -->
  <div class="advanced-panel" id="advPanel">

    <div class="section-title">Crop</div>
    <div class="row">
      <div>
        <label>Aspect Ratio</label>
        <select id="cropRatio">
          <option value="1:1">1:1 (Square)</option>
          <option value="16:9">16:9</option>
          <option value="4:3">4:3</option>
          <option value="none">No crop</option>
        </select>
      </div>
      <div>
        <label>Keep dimension</label>
        <select id="cropKeep">
          <option value="height">Height</option>
          <option value="width">Width</option>
        </select>
      </div>
    </div>
    <div>
      <label>Crop horizontal offset (0 = center, -100 left, +100 right)</label>
      <div class="range-row">
        <input type="range" id="cropOffsetX" min="-100" max="100" value="0">
        <span class="range-val" id="cropOffsetXVal">0</span>
      </div>
    </div>
    <div>
      <label>Crop vertical offset (0 = center, -100 top, +100 bottom)</label>
      <div class="range-row">
        <input type="range" id="cropOffsetY" min="-100" max="100" value="0">
        <span class="range-val" id="cropOffsetYVal">0</span>
      </div>
    </div>

    <div class="section-title">Caption Position</div>
    <div class="row">
      <div>
        <label>Vertical position</label>
        <select id="captionPos">
          <option value="top">Top</option>
          <option value="bottom">Bottom</option>
        </select>
      </div>
      <div>
        <label>Text alignment</label>
        <select id="textAlign">
          <option value="center">Center</option>
          <option value="left">Left</option>
          <option value="right">Right</option>
        </select>
      </div>
    </div>

    <div class="section-title">Padding</div>
    <div class="row triple">
      <div>
        <label>Edge padding (%)</label>
        <input type="number" id="edgePad" value="5" min="0" max="30" step="0.5">
      </div>
      <div>
        <label>Text padding top/bottom (%)</label>
        <input type="number" id="innerPad" value="30" min="0" max="100" step="1">
      </div>
      <div>
        <label>Max text height (% of image)</label>
        <input type="number" id="maxTextHeight" value="20" min="5" max="80" step="1">
      </div>
    </div>

    <div class="section-title">Box</div>
    <div class="row">
      <div>
        <label>Box color</label>
        <div class="color-row">
          <input type="color" id="boxColor" value="#808080">
          <input type="text" id="boxColorHex" value="#808080" maxlength="9">
        </div>
      </div>
      <div>
        <label>Box opacity (%)</label>
        <div class="range-row">
          <input type="range" id="boxOpacity" min="0" max="100" value="50">
          <span class="range-val" id="boxOpacityVal">50%</span>
        </div>
      </div>
    </div>

    <div class="section-title">Text</div>
    <div class="row">
      <div>
        <label>Text color</label>
        <div class="color-row">
          <input type="color" id="textColor" value="#ffffff">
          <input type="text" id="textColorHex" value="#ffffff" maxlength="9">
        </div>
      </div>
      <div>
        <label>Shadow color</label>
        <div class="color-row">
          <input type="color" id="shadowColor" value="#3c3c3c">
          <input type="text" id="shadowColorHex" value="#3c3c3c" maxlength="9">
        </div>
      </div>
    </div>
    <div>
      <label>Shadow offset (voxels)</label>
      <div class="range-row">
        <input type="range" id="shadowVoxels" min="0" max="4" step="0.5" value="1">
        <span class="range-val" id="shadowVoxelsVal">1</span>
      </div>
    </div>

  </div><!-- /advanced-panel -->

</div>

<div class="output-wrap" id="outputWrap">
  <img class="preview" id="preview" alt="Captioned image">
  <button class="dl-btn" id="downloadBtn">Download Image</button>
</div>

<canvas id="canvas"></canvas>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const filenameEl = document.getElementById('filename');
  const captionText = document.getElementById('captionText');
  const canvas = document.getElementById('canvas');
  const preview = document.getElementById('preview');
  const outputWrap = document.getElementById('outputWrap');
  const downloadBtn = document.getElementById('downloadBtn');
  const advToggle = document.getElementById('advToggle');
  const advPanel = document.getElementById('advPanel');

  let uploadedImage = null;
  let renderTimer = null;

  // Debounced auto-render
  function scheduleRender() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 120);
  }

  // Advanced toggle
  advToggle.addEventListener('click', () => {
    advPanel.classList.toggle('open');
    advToggle.textContent = advPanel.classList.contains('open') ? '⚙ Advanced ▲' : '⚙ Advanced';
  });

  // Range live values + auto-render
  function bindRange(id, valId, suffix = '') {
    const el = document.getElementById(id);
    const val = document.getElementById(valId);
    el.addEventListener('input', () => { val.textContent = el.value + suffix; scheduleRender(); });
  }
  bindRange('cropOffsetX', 'cropOffsetXVal');
  bindRange('cropOffsetY', 'cropOffsetYVal');
  bindRange('boxOpacity', 'boxOpacityVal', '%');
  bindRange('shadowVoxels', 'shadowVoxelsVal');

  // Color pickers <-> hex inputs sync + auto-render
  function bindColor(pickerId, hexId) {
    const picker = document.getElementById(pickerId);
    const hex = document.getElementById(hexId);
    picker.addEventListener('input', () => { hex.value = picker.value; scheduleRender(); });
    hex.addEventListener('input', () => {
      if (/^#[0-9a-fA-F]{6}$/.test(hex.value)) { picker.value = hex.value; scheduleRender(); }
    });
  }
  bindColor('boxColor', 'boxColorHex');
  bindColor('textColor', 'textColorHex');
  bindColor('shadowColor', 'shadowColorHex');

  // All other inputs/selects in advanced panel
  ['cropRatio','cropKeep','captionPos','textAlign','edgePad','innerPad','maxTextHeight'].forEach(id => {
    document.getElementById(id).addEventListener('change', scheduleRender);
    document.getElementById(id).addEventListener('input', scheduleRender);
  });

  // Caption text
  captionText.addEventListener('input', scheduleRender);

  // Drag and drop
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadFile(file);
  });
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

  function loadFile(file) {
    filenameEl.textContent = file.name;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => { uploadedImage = img; scheduleRender(); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // Load font then re-render if already have image+text
  const mcFont = new FontFace('Minecraft', 'url(https://tggamesyt.dev/assets/Minecraft-Seven_v2.ttf)');
  mcFont.load().then(f => { document.fonts.add(f); scheduleRender(); }).catch(() => {});

  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function render() {
    const text = captionText.value.trim();
    if (!uploadedImage || !text) return;

    // Read settings
    const cropRatio    = document.getElementById('cropRatio').value;
    const cropKeep     = document.getElementById('cropKeep').value;
    const cropOffsetX  = parseFloat(document.getElementById('cropOffsetX').value) / 100;
    const cropOffsetY  = parseFloat(document.getElementById('cropOffsetY').value) / 100;
    const captionPos   = document.getElementById('captionPos').value;
    const textAlignVal = document.getElementById('textAlign').value;
    const edgePadPct   = parseFloat(document.getElementById('edgePad').value) / 100;
    const innerPadPct  = parseFloat(document.getElementById('innerPad').value) / 100;
    const maxTextHPct  = parseFloat(document.getElementById('maxTextHeight').value) / 100;
    const boxColorHex  = document.getElementById('boxColorHex').value;
    const boxOpacity   = parseFloat(document.getElementById('boxOpacity').value) / 100;
    const textColorHex = document.getElementById('textColorHex').value;
    const shadowColorHex = document.getElementById('shadowColorHex').value;
    const shadowVoxels = parseFloat(document.getElementById('shadowVoxels').value);

    const srcW = uploadedImage.naturalWidth;
    const srcH = uploadedImage.naturalHeight;

    // Compute crop
    let cropSrcX = 0, cropSrcY = 0, cropSrcW = srcW, cropSrcH = srcH;

    if (cropRatio !== 'none') {
      const [rw, rh] = cropRatio.split(':').map(Number);
      const targetAspect = rw / rh;

      if (cropKeep === 'height') {
        cropSrcH = srcH;
        cropSrcW = Math.round(srcH * targetAspect);
      } else {
        cropSrcW = srcW;
        cropSrcH = Math.round(srcW / targetAspect);
      }

      // Clamp
      cropSrcW = Math.min(cropSrcW, srcW);
      cropSrcH = Math.min(cropSrcH, srcH);

      // Center + offset
      const maxOffX = (srcW - cropSrcW) / 2;
      const maxOffY = (srcH - cropSrcH) / 2;
      cropSrcX = Math.round(maxOffX + cropOffsetX * maxOffX);
      cropSrcY = Math.round(maxOffY + cropOffsetY * maxOffY);
    }

    const W = cropSrcW;
    const H = cropSrcH;

    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    ctx.drawImage(uploadedImage, cropSrcX, cropSrcY, cropSrcW, cropSrcH, 0, 0, W, H);

    // Box dimensions
    const pad = Math.round(W * edgePadPct);
    const boxX1 = pad;
    const boxX2 = W - pad;
    const boxInnerW = boxX2 - boxX1;

    // Max font size constrained by box width AND max height % of image
    const maxTextH = H * maxTextHPct;

    let lo = 8, hi = 800;
    while (lo < hi) {
      const mid = Math.ceil((lo + hi) / 2);
      ctx.font = `${mid}px Minecraft`;
      const m = ctx.measureText(text);
      const tw = m.width;
      const th = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
      if (tw <= boxInnerW && th <= maxTextH) lo = mid;
      else hi = mid - 1;
    }

    const fontSize = lo;
    ctx.font = `${fontSize}px Minecraft`;
    const metrics = ctx.measureText(text);
    const textW = metrics.width;
    const textH = metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent;
    const ascent = metrics.actualBoundingBoxAscent;

    // 1 voxel = measured from dash stroke (~fontSize/9.6)
    const oneVoxel = Math.round(fontSize / 9.6);
    const shadowOff = Math.round(oneVoxel * shadowVoxels);

    const innerPadY = Math.round(textH * innerPadPct);
    const boxH = textH + innerPadY * 2;

    const boxY1 = captionPos === 'top' ? pad : H - pad - boxH;
    const boxY2 = boxY1 + boxH;

    // Draw box
    ctx.fillStyle = hexToRgba(boxColorHex, boxOpacity);
    ctx.fillRect(boxX1, boxY1, boxX2 - boxX1, boxH);

    // Text X based on alignment
    let textX;
    if (textAlignVal === 'center') textX = boxX1 + Math.round((boxInnerW - textW) / 2);
    else if (textAlignVal === 'left') textX = boxX1 + innerPadY;
    else textX = boxX2 - textW - innerPadY;

    const textY = boxY1 + innerPadY + ascent;

    // Shadow
    if (shadowVoxels > 0) {
      ctx.fillStyle = hexToRgba(shadowColorHex, 1);
      ctx.fillText(text, textX + shadowOff, textY + shadowOff);
    }

    // Main text
    ctx.fillStyle = hexToRgba(textColorHex, 1);
    ctx.fillText(text, textX, textY);

    const dataUrl = canvas.toDataURL('image/png');
    preview.src = dataUrl;
    outputWrap.classList.add('visible');
    downloadBtn.onclick = () => {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = 'captioned.png';
      a.click();
    };
  }
</script>
</body>
</html>
